name: Docker

# release.yml calls this once it has created a release, as a release that a
# workflow's GITHUB_TOKEN creates starts no other workflow.
# Only a run with a tag pushes the image (the version tags and latest). A
# dispatch with no tag builds from the Dockerfile's default and pushes
# nothing, so it cannot move latest.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) whose binaries the image installs
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (vX.Y.Z) to build and push. Empty builds only.
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TAG: ${{ inputs.tag }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: env.TAG != ''
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.TAG != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.TAG != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ env.TAG && format('BLINK_VERSION={0}', env.TAG) || '' }}
