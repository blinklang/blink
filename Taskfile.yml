version: '3'

vars:
  BUILD_DIR: build
  BLINKC: build/blinkc
  JOBS:
    sh: nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 12
  VERSION:
    sh: cat VERSION | tr -d '\n'

tasks:
  bootstrap:
    desc: Build compiler from bootstrap and verify self-hosting
    sources:
      - bootstrap/runtime*.h
      - bootstrap/bootstrap.sh
      - src/*.bl
      - lib/std/*.bl
      - lib/pkg/*.bl
    generates:
      - '{{.BUILD_DIR}}/blinkc'
    cmds:
      - ./bootstrap/bootstrap.sh

  regen:
    desc: Rebuild compiler and verify self-hosting
    cmds:
      - task: gen-stdlib-registry
      - cp -f {{.BUILD_DIR}}/blinkc {{.BUILD_DIR}}/blinkc.bak 2>/dev/null || true
      - ./bootstrap/bootstrap.sh
      - task: build-cli
      - BLINK_FORCE_STDLIB_REBUILD=1 {{.BUILD_DIR}}/blink __build-stdlib-archive

  test-bootstrap-cold:
    desc: |
      Regression for 64x8bp by construction — once sqlite is peeled out
      of the stdlib archive (no blink_sqlite3_* refs in monolith.o), the
      old double-link path is unreachable: nothing forces sqlite3.o into
      a user link unless the user actually imports std.db_sqlite, and the
      CLI itself doesn't. This target now asserts the stronger invariant
      that supersedes the original 64x8bp dedupe check:
        build/blink must contain zero sqlite text symbols.
      If this fails, sqlite leaked back into the archive monolith or
      into the CLI's user TU and the peel is broken.
    deps: [build-cli]
    silent: true
    cmds:
      - |
        set -e
        if [ ! -x "{{.BUILD_DIR}}/blink" ]; then
          echo "test-bootstrap-cold: FAIL — {{.BUILD_DIR}}/blink not built"
          exit 1
        fi
        SQL_TEXT=$(nm "{{.BUILD_DIR}}/blink" 2>/dev/null | grep -c -E '^[0-9a-f]+ T (blink_)?sqlite3_' || true)
        if [ "$SQL_TEXT" -ne 0 ]; then
          echo "test-bootstrap-cold: FAIL — build/blink contains $SQL_TEXT sqlite text symbols (expect 0)"
          nm "{{.BUILD_DIR}}/blink" | grep -E '^[0-9a-f]+ T (blink_)?sqlite3_' | head -5 >&2
          exit 1
        fi
        echo "test-bootstrap-cold: PASS (build/blink has zero sqlite symbols)"

  test-sqlite-peel:
    desc: |
      Asserts sqlite is peeled out of the stdlib archive — building a
      non-sqlite program must (a) not produce `.tmp/sqlite3.o`, and (b)
      yield a binary with zero sqlite text symbols. RED on main because
      `do_link_target` unconditionally force-includes sqlite3.o into
      every user link. GREEN after the native-dep registry peels
      owner_module=std/db_sqlite + transitive bodies out of monolith.o
      and codegen emits them per-TU only when the user imports them.
    deps: [build-cli]
    silent: true
    cmds:
      - |
        set -e
        mkdir -p .tmp/peel
        LOG=".tmp/peel/probe.log"

        cat > .tmp/peel/hello.bl <<'EOF'
        fn main() ! IO {
            io.println("hello from peel probe")
        }
        EOF
        find .tmp -maxdepth 1 -name 'sqlite3*.o' -delete 2>/dev/null || true
        rm -f .tmp/peel/hello
        if ! {{.BUILD_DIR}}/blink build .tmp/peel/hello.bl --output .tmp/peel/hello > "$LOG" 2>&1; then
          echo "test-sqlite-peel: FAIL — hello-world build failed"
          tail -40 "$LOG" >&2
          exit 1
        fi

        # (a) non-sqlite build must NOT produce .tmp/sqlite3.o.
        if [ -f .tmp/sqlite3.o ]; then
          echo "test-sqlite-peel: FAIL — non-sqlite build produced .tmp/sqlite3.o"
          exit 1
        fi

        # (b) resulting binary must contain zero sqlite text symbols.
        SQL_TEXT=$(nm .tmp/peel/hello 2>/dev/null | grep -c -E '^[0-9a-f]+ T (blink_)?sqlite3_' || true)
        if [ "$SQL_TEXT" -ne 0 ]; then
          echo "test-sqlite-peel: FAIL — non-sqlite binary contains $SQL_TEXT sqlite text symbols (expect 0)"
          nm .tmp/peel/hello | grep -E '^[0-9a-f]+ T (blink_)?sqlite3_' | head -5 >&2
          exit 1
        fi

        rm -f .tmp/peel/hello
        echo "test-sqlite-peel: PASS"

  compile-test:
    desc: "Compile a single test file (usage: task compile-test -- test_name)"
    deps: [build-cli]
    cmds:
      - '{{.BUILD_DIR}}/blink build tests/{{.CLI_ARGS}}.bl'

  test:
    desc: Compile and run all test_*.bl files
    deps: [build-cli]
    cmds:
      - '{{.BUILD_DIR}}/blink test tests/ --parallel {{.JOBS}}'

  build-cli:
    desc: Build the blink CLI tool
    deps: [bootstrap]
    sources:
      - src/*.bl
      - lib/std/*.bl
      - lib/pkg/*.bl
      - '{{.BUILD_DIR}}/blinkc'
      - llms.md
      - llms-full.md
      - CHANGELOG.md
      - bootstrap/runtime*.h
      - templates/**
    generates:
      - '{{.BUILD_DIR}}/blink'
    cmds:
      - |
        # Seed build/blink on a clean tree so __build-stdlib-archive has a runner.
        if [ ! -x "{{.BUILD_DIR}}/blink" ]; then
          {{.BLINKC}} src/cli.bl {{.BUILD_DIR}}/cli.c
          sed -i 's/blink_cli_version = "dev"/blink_cli_version = "{{.VERSION}}-dev+'"$(date +%Y%m%d%H%M%S)"'"/' {{.BUILD_DIR}}/cli.c
          cc -o {{.BUILD_DIR}}/blink {{.BUILD_DIR}}/cli.c -lm -lgc
        fi
        {{.BUILD_DIR}}/blink __build-stdlib-archive
        {{.BLINKC}} --link-archive {{.BUILD_DIR}}/libblink_std.h src/cli.bl {{.BUILD_DIR}}/cli.c
        sed -i 's/blink_cli_version = "dev"/blink_cli_version = "{{.VERSION}}-dev+'"$(date +%Y%m%d%H%M%S)"'"/' {{.BUILD_DIR}}/cli.c
        cc -o {{.BUILD_DIR}}/blink {{.BUILD_DIR}}/cli.c -I{{.BUILD_DIR}} {{.BUILD_DIR}}/libblink_std.a -lm -lgc -pthread -Wl,--gc-sections
        echo "CLI built at {{.BUILD_DIR}}/blink ({{.VERSION}}-dev, archive-linked)"

  build:
    desc: Build and install blink to ~/.local/bin/
    deps: [build-cli]
    cmds:
      - mkdir -p ~/.local/bin ~/.local/share/blink
      - rm -f ~/.local/bin/blink.bak
      - mv ~/.local/bin/blink ~/.local/bin/blink.bak 2>/dev/null || true
      - cp {{.BUILD_DIR}}/blink ~/.local/bin/blink
      - cp {{.BUILD_DIR}}/libblink_std.a {{.BUILD_DIR}}/libblink_std.h {{.BUILD_DIR}}/runtime.h ~/.local/share/blink/
      # Identity stamp (runtime.h SHA | blinkc SHA | version) so the installed
      # blink can reject a stale archive at link time instead of silently
      # linking an ABI-skewed binary (br 105z02). Follows the build/ symlink
      # into the std-cache dir; -L so the real file lands, not a dangling link.
      - cp -L {{.BUILD_DIR}}/.archive-id ~/.local/share/blink/
      # Copy each registered native dep's source + headers as a sidecar so
      # the installed blink can compile a user TU that imports a peeled
      # stdlib module (e.g. std/db_sqlite). Layout mirrors the dev tree:
      # share/blink/native/<name>/{<file>.c, <file>.h}. Driven by the
      # __native-deps registry so adding a dep needs no Taskfile edit.
      - |
        {{.BUILD_DIR}}/blink __native-deps | while IFS='|' read -r NAME SRCS HDR_DIR _DEFS _GATE; do
          [ -z "$NAME" ] && continue
          DEST=~/.local/share/blink/native/"$NAME"
          mkdir -p "$DEST"
          IFS=',' ; for SRC in $SRCS; do cp "$SRC" "$DEST/" ; done ; unset IFS
          if [ -d "$HDR_DIR" ]; then
            find "$HDR_DIR" -maxdepth 1 -name '*.h' -exec cp {} "$DEST/" \;
          fi
        done
      - echo "Installed blink to ~/.local/bin/blink (stdlib archive in ~/.local/share/blink/)"

  test-fmt:
    desc: Test formatter idempotency and golden outputs
    deps: [bootstrap]
    cmds:
      - mkdir -p .tmp
      - |
        printf '%s\n' test_hof test_lazy_iter test_semver test_toml test_manifest test_lockfile test_http_types test_http_error test_json test_json_builder test_args test_args_cli test_derive_nested test_embed test_combining_iterators test_http_client test_iterators test_match_void_if test_multifile_visibility test_question_ops test_string_iter test_audit test_e2e_gitdep test_e2e_transitive test_e2e_pub_visibility test_async_spawn_types test_tcp_socket test_pub_import test_std_testing test_c_reserved_names test_module_qualified_types test_ue_complex_returns test_effects test_effect_vtable test_sqlite test_builtin_methods test_priv_access test_unused_import test_cross_module_effects test_cross_module_effects_helper test_map_seed_deterministic > .tmp/fmt_skip.txt

        golden_results=$(systemd-run --user --scope -p MemoryMax=50G --quiet parallel -j {{.JOBS}} --halt never ./scripts/run_fmt_golden.sh {} {{.BLINKC}} ::: tests/fmt/input_*.bl 2>&1 || true)
        idem_results=$(systemd-run --user --scope -p MemoryMax=50G --quiet parallel -j {{.JOBS}} --halt never ./scripts/run_fmt_idempotent.sh {} {{.BLINKC}} .tmp/fmt_skip.txt ::: tests/test_*.bl 2>&1 || true)
        sem_results=$(systemd-run --user --scope -p MemoryMax=50G --quiet parallel -j {{.JOBS}} --halt never ./scripts/run_fmt_semantic.sh {} {{.BLINKC}} .tmp/fmt_skip.txt ::: tests/test_*.bl 2>&1 || true)

        all_results=$(printf '%s\n%s\n%s' "$golden_results" "$idem_results" "$sem_results")

        passed=$(echo "$all_results" | grep -c "^PASS" || true)
        failed=$(echo "$all_results" | grep -c "^FAIL" || true)
        skipped=$(echo "$all_results" | grep -c "^SKIP" || true)
        echo "fmt: ${passed} passed, ${failed} failed, ${skipped} skipped"
        if [ "$failed" -gt 0 ]; then
          echo "Failures:"
          echo "$all_results" | grep "^FAIL" | sed 's/^/  /'
          exit 1
        fi

  fuzz:
    desc: Run fuzz testing against lexer and parser
    deps: [bootstrap]
    cmds:
      - mkdir -p .tmp/fuzz_crashes
      - ./scripts/fuzz.sh {{.BLINKC}} {{.CLI_ARGS | default "500"}}

  test-installed:
    desc: Test that installed blink works outside project tree
    deps: [build-cli]
    cmds:
      - |
        set -e
        REPO_ROOT="$(pwd)"
        REPO_BUILD="$REPO_ROOT/{{.BUILD_DIR}}"
        TMPDIR=$(mktemp -d)
        trap "rm -rf $TMPDIR" EXIT
        INSTALL_PREFIX="$TMPDIR/install"
        mkdir -p "$INSTALL_PREFIX/bin" "$INSTALL_PREFIX/share/blink"
        cp {{.BUILD_DIR}}/blink "$INSTALL_PREFIX/bin/blink"
        cp {{.BUILD_DIR}}/libblink_std.a {{.BUILD_DIR}}/libblink_std.h {{.BUILD_DIR}}/runtime.h "$INSTALL_PREFIX/share/blink/"
        cp -L {{.BUILD_DIR}}/.archive-id "$INSTALL_PREFIX/share/blink/"
        # Mirror the install pipeline: drop each registered native dep
        # under <prefix>/share/blink/native/<name>/ so resolve_native_dep_source
        # finds the sidecar copy instead of falling through to the dev tree.
        {{.BUILD_DIR}}/blink __native-deps | while IFS='|' read -r NAME SRCS HDR_DIR _DEFS _GATE; do
          [ -z "$NAME" ] && continue
          DEST="$INSTALL_PREFIX/share/blink/native/$NAME"
          mkdir -p "$DEST"
          IFS=',' ; for SRC in $SRCS; do cp "$SRC" "$DEST/" ; done ; unset IFS
          if [ -d "$HDR_DIR" ]; then
            find "$HDR_DIR" -maxdepth 1 -name '*.h' -exec cp {} "$DEST/" \;
          fi
        done
        cat > "$TMPDIR/test_standalone.bl" << 'BLINK'
        import std.path.{path_join}
        import std.sb.{sb_new, sb_write}

        fn main() ! IO {
            let p = path_join("hello", "world")
            io.println(p)
            let s = sb_new()
            sb_write(s, "ok")
            io.println(s.to_str())
        }
        BLINK
        EXPECTED=$(printf 'hello/world\nok')

        # Case 1: invoke via full path (covers absolute argv[0]).
        cd "$TMPDIR"
        OUTPUT=$(env -u BLINK_ROOT "$INSTALL_PREFIX/bin/blink" run "$TMPDIR/test_standalone.bl" 2>&1)
        if [ "$OUTPUT" != "$EXPECTED" ]; then
          echo "FAIL test-installed (full-path invocation)"
          echo "Expected: $EXPECTED"
          echo "Got: $OUTPUT"
          exit 1
        fi
        echo "PASS test-installed (full-path invocation)"

        # Case 2: invoke as bare `blink` from a project subdir (covers
        # PATH-resolved argv[0] = "blink"). Mimics a real user running
        # `blink build src/main.bl` from their project root. This is the
        # path that broke in 8gtzx8 — readlink -f on a bare basename
        # joined cwd onto it and resolved share/blink/ relative to the
        # wrong root, falling through to "build" (the user's project
        # build dir, which has no archive).
        PROJECT_DIR="$TMPDIR/userproj"
        mkdir -p "$PROJECT_DIR/src"
        cp "$TMPDIR/test_standalone.bl" "$PROJECT_DIR/src/main.bl"
        cd "$PROJECT_DIR"
        OUTPUT=$(env -u BLINK_ROOT PATH="$INSTALL_PREFIX/bin:$PATH" blink run src/main.bl 2>&1)
        if [ "$OUTPUT" != "$EXPECTED" ]; then
          echo "FAIL test-installed (PATH-resolved invocation)"
          echo "Expected: $EXPECTED"
          echo "Got: $OUTPUT"
          exit 1
        fi
        echo "PASS test-installed (PATH-resolved invocation)"

        # Case 3: `blink test` from a project. Exercises the share/blink/
        # runtime.h fallback used in installed mode (no BLINK_ROOT).
        cat > "$PROJECT_DIR/src/main.bl" << 'BLINK'
        fn fail() -> Result[Int, Str] {
            Err("boom")
        }
        test "qm propagates" {
            let _ = fail()?
        }
        BLINK
        TEST_OUTPUT=$(env -u BLINK_ROOT PATH="$INSTALL_PREFIX/bin:$PATH" blink test src/main.bl 2>&1 || true)
        if echo "$TEST_OUTPUT" | grep -q "cannot open file:"; then
          echo "FAIL test-installed (blink test crashed with empty path)"
          echo "Got: $TEST_OUTPUT"
          exit 1
        fi
        echo "PASS test-installed (blink test runs without empty-path crash)"

        # Case 4: program importing std.db_sqlite — exercises the peeled-
        # module path and the cold-bootstrap double-link regression (edq96x).
        # Pre-seeds .tmp/sqlite3.o (the "leftover from prior build" condition
        # in the bug report) so compile_vendored_source's mtime-skip reuses
        # it instead of recompiling. v0.44.2-class regressions emit two
        # copies of .tmp/sqlite3.o on the cc line → ld "multiple definition
        # of sqlite3_*". Asserts:
        #   (a) no "multiple definition" in stderr (named diagnostic for edq96x)
        #   (b) blink run exits 0 with stdout "sidecar-ok" (peeled-module
        #       resolves from share/blink/native/ + functional link)
        cat > "$PROJECT_DIR/src/main.bl" << 'BLINK'
        import std.db_sqlite.{sqlite_open, sqlite_close}

        fn main() ! IO {
            let handle = sqlite_open(":memory:")
            let _ = sqlite_close(handle)
            io.println("sidecar-ok")
        }
        BLINK
        mkdir -p "$PROJECT_DIR/.tmp"
        cc -c -o "$PROJECT_DIR/.tmp/sqlite3.o" \
            "$INSTALL_PREFIX/share/blink/native/sqlite3/sqlite3.c"
        touch "$PROJECT_DIR/.tmp/sqlite3.o"
        SQLITE_OUT=$(env -u BLINK_ROOT PATH="$INSTALL_PREFIX/bin:$PATH" blink run src/main.bl 2>&1 || true)
        if echo "$SQLITE_OUT" | grep -q "multiple definition"; then
          echo "FAIL test-installed (sqlite sidecar — edq96x cold-bootstrap double-link regression)"
          echo "$SQLITE_OUT" | grep "multiple definition" | head -5
          exit 1
        fi
        if [ "$SQLITE_OUT" != "sidecar-ok" ]; then
          echo "FAIL test-installed (sqlite sidecar)"
          echo "Got: $SQLITE_OUT"
          exit 1
        fi
        echo "PASS test-installed (sqlite sidecar — peeled-module + edq96x regression)"

        # Case 5: std.db_sqlite against an install.sh-style layout. Unlike
        # Cases 1-4 (which stage $INSTALL_PREFIX with the full native sidecar
        # loop, mirroring `task install`), this case stages a SEPARATE prefix
        # using ONLY the copy steps the public install.sh / Dockerfiles run.
        # The shell block below is kept in sync with install.sh's copy logic:
        # the GREEN install.sh copies share/blink/native/ recursively, so this
        # mirror does too. Two release blockers converge here:
        #
        #   (1) install.sh / Dockerfile must copy share/blink/native/ so
        #       resolve_native_dep_source finds the vendored sqlite source
        #       (else it returns "" — no sidecar, no manifest, no dev tree).
        #   (2) the CLI must NOT also append the dynamic `-lsqlite3` for a
        #       registry dep it links statically from the sidecar — otherwise
        #       the build pulls sqlite from the system libsqlite3.so (leaving
        #       undefined `U sqlite3_` symbols + an ldd dependency), and once
        #       libsqlite3-dev is dropped from the Docker image the link fails
        #       with `ld: cannot find -lsqlite3`. (br vhgt3s)
        #
        # The assertion below is host-independent: it requires the produced
        # binary to have ZERO undefined `U sqlite3_` symbols, i.e. sqlite is
        # fully satisfied by the vendored sidecar .o, not the system .so. On a
        # host WITH libsqlite3-dev (where the build would otherwise "work"
        # dynamically) this still goes RED for blocker (2) pre-fix.
        SH_PREFIX="$TMPDIR/install_sh"
        mkdir -p "$SH_PREFIX/bin" "$SH_PREFIX/share/blink"
        cp "$REPO_BUILD/blink" "$SH_PREFIX/bin/blink"
        # The release tarball stages share/blink/native/ next to the three
        # core files; install.sh copies from that tarball. We don't have a
        # tarball here, so we reconstruct the tarball's share/blink/ contents
        # in $SH_TARBALL using the SAME files build-binaries stages, then run
        # the install.sh copy logic against it. Keep the copy block below in
        # exact sync with install.sh:114 — that is what this case guards.
        SH_TARBALL="$TMPDIR/sh_tarball/share/blink"
        mkdir -p "$SH_TARBALL"
        cp "$REPO_BUILD/libblink_std.a" "$REPO_BUILD/libblink_std.h" "$REPO_BUILD/runtime.h" "$SH_TARBALL/"
        cp -L "$REPO_BUILD/.archive-id" "$SH_TARBALL/"
        ( cd "$REPO_ROOT" && "$REPO_BUILD/blink" __native-deps | while IFS='|' read -r NAME SRCS HDR_DIR _DEFS _GATE; do
            [ -z "$NAME" ] && continue
            DEST="$SH_TARBALL/native/$NAME"
            mkdir -p "$DEST"
            IFS=',' ; for SRC in $SRCS; do cp "$SRC" "$DEST/" ; done ; unset IFS
            if [ -d "$HDR_DIR" ]; then
              find "$HDR_DIR" -maxdepth 1 -name '*.h' -exec cp {} "$DEST/" \;
            fi
          done )
        # --- begin install.sh copy mirror (keep in sync with install.sh:114) ---
        cp "$SH_TARBALL/libblink_std.a" \
           "$SH_TARBALL/libblink_std.h" \
           "$SH_TARBALL/runtime.h" \
           "$SH_PREFIX/share/blink/"
        if [ -f "$SH_TARBALL/.archive-id" ]; then
          cp "$SH_TARBALL/.archive-id" "$SH_PREFIX/share/blink/"
        fi
        if [ -d "$SH_TARBALL/native" ]; then
          cp -R "$SH_TARBALL/native" "$SH_PREFIX/share/blink/"
        fi
        # --- end install.sh copy mirror ---
        SH_PROJECT="$TMPDIR/sh_userproj"
        mkdir -p "$SH_PROJECT/src"
        cat > "$SH_PROJECT/src/main.bl" << 'BLINK'
        import std.db_sqlite.{sqlite_open, sqlite_close}

        fn main() ! IO {
            let handle = sqlite_open(":memory:")
            let _ = sqlite_close(handle)
            io.println("install-sh-ok")
        }
        BLINK
        cd "$SH_PROJECT"
        SH_BIN="$SH_PROJECT/main"
        SH_BUILD_LOG=$(env -u BLINK_ROOT PATH="$SH_PREFIX/bin:$PATH" blink build src/main.bl --output "$SH_BIN" 2>&1 || true)
        if [ ! -x "$SH_BIN" ]; then
          echo "FAIL test-installed (install.sh layout — std.db_sqlite build failed)"
          echo "$SH_BUILD_LOG" | tail -20
          exit 1
        fi
        # Blocker (3): the user-TU obj-cache compile must pass the vendored -I
        # so it can resolve the peeled dep's header (runtime.h does
        # `#include <sqlite3.h>`). Without it, hosts lacking a system sqlite3.h
        # print `fatal error: sqlite3.h: No such file or directory` and only
        # succeed by falling through to the combined link. Reject that stderr
        # noise even when the build exits 0. (br r04433) NOTE: this only goes
        # RED on a host without a system sqlite3.h (e.g. a clean CI container);
        # on a dev host with libsqlite3-dev the header resolves from the system
        # path and masks the bug — the Docker in-image check is the real gate.
        if echo "$SH_BUILD_LOG" | grep -q "fatal error:.*sqlite3.h"; then
          echo "FAIL test-installed (install.sh layout — user-TU cache compile could not find the sidecar sqlite3.h; vendored -I not threaded into the obj-cache compile — br r04433)"
          echo "$SH_BUILD_LOG" | grep "fatal error" | head -3
          exit 1
        fi
        # Blocker (2): no undefined sqlite symbols — the sidecar .o must
        # statically satisfy sqlite, not the system libsqlite3.so.
        SH_U=$(nm "$SH_BIN" 2>/dev/null | grep -c -E '^ +U sqlite3_' || true)
        if [ "$SH_U" -ne 0 ]; then
          echo "FAIL test-installed (install.sh layout — $SH_U undefined 'U sqlite3_' symbols; sqlite resolved dynamically via -lsqlite3 instead of the vendored sidecar — br vhgt3s)"
          nm "$SH_BIN" | grep -E '^ +U sqlite3_' | head -5 >&2
          exit 1
        fi
        SH_OUT=$(env -u BLINK_ROOT PATH="$SH_PREFIX/bin:$PATH" "$SH_BIN" 2>&1 || true)
        if [ "$SH_OUT" != "install-sh-ok" ]; then
          echo "FAIL test-installed (install.sh layout — runtime output)"
          echo "Got: $SH_OUT"
          exit 1
        fi
        echo "PASS test-installed (install.sh layout — std.db_sqlite statically vendored from sidecar)"

  ci:
    desc: Full CI — regen bootstrap + run all tests
    silent: true
    sources:
      - src/*.bl
      - lib/std/*.bl
      - lib/pkg/*.bl
      - tests/test_*.bl
      - tests/fmt/**
      - bootstrap/runtime*.h
      - bootstrap/bootstrap.sh
      - scripts/run_fmt_*.sh
      - llms.md
      - llms-full.md
      - CHANGELOG.md
    cmds:
      - find .tmp -type f ! -name '.gitkeep' -delete 2>/dev/null || true
      - |
        output=$(./bootstrap/bootstrap.sh 2>&1)
        if echo "$output" | grep -q "Bootstrap verified"; then
          echo "regen: ok"
        else
          echo "$output"
          exit 1
        fi
      - task: check-stdlib-registry
      - |
        if [ ! -x "{{.BUILD_DIR}}/blink" ]; then
          {{.BLINKC}} src/cli.bl {{.BUILD_DIR}}/cli.c 2>/dev/null
          sed -i 's/blink_cli_version = "dev"/blink_cli_version = "{{.VERSION}}-dev+'"$(date +%Y%m%d%H%M%S)"'"/' {{.BUILD_DIR}}/cli.c
          cc -o {{.BUILD_DIR}}/blink {{.BUILD_DIR}}/cli.c -lm -lgc
        fi
        {{.BUILD_DIR}}/blink __build-stdlib-archive
        {{.BLINKC}} --link-archive {{.BUILD_DIR}}/libblink_std.h src/cli.bl {{.BUILD_DIR}}/cli.c 2>/dev/null
        sed -i 's/blink_cli_version = "dev"/blink_cli_version = "{{.VERSION}}-dev+'"$(date +%Y%m%d%H%M%S)"'"/' {{.BUILD_DIR}}/cli.c
        cc -o {{.BUILD_DIR}}/blink {{.BUILD_DIR}}/cli.c -I{{.BUILD_DIR}} {{.BUILD_DIR}}/libblink_std.a -lm -lgc -pthread -Wl,--gc-sections
      - '{{.BUILD_DIR}}/blink test tests/ --parallel {{.JOBS}} --quiet'
      - task: test-bootstrap-cold
      - task: test-sqlite-peel
      - |
        mkdir -p .tmp
        printf '%s\n' test_hof test_lazy_iter test_semver test_toml test_manifest test_lockfile test_http_types test_http_error test_json test_json_builder test_args test_args_cli test_derive_nested test_embed test_combining_iterators test_http_client test_iterators test_match_void_if test_multifile_visibility test_question_ops test_string_iter test_audit test_e2e_gitdep test_e2e_transitive test_e2e_pub_visibility test_async_spawn_types test_tcp_socket test_pub_import test_std_testing test_c_reserved_names test_module_qualified_types test_ue_complex_returns test_effects test_effect_vtable test_sqlite test_builtin_methods test_priv_access test_unused_import test_cross_module_effects test_cross_module_effects_helper test_map_seed_deterministic > .tmp/fmt_skip.txt

        golden_results=$(systemd-run --user --scope -p MemoryMax=50G --quiet parallel -j {{.JOBS}} --halt never ./scripts/run_fmt_golden.sh {} {{.BLINKC}} ::: tests/fmt/input_*.bl 2>&1 || true)
        idem_results=$(systemd-run --user --scope -p MemoryMax=50G --quiet parallel -j {{.JOBS}} --halt never ./scripts/run_fmt_idempotent.sh {} {{.BLINKC}} .tmp/fmt_skip.txt ::: tests/test_*.bl 2>&1 || true)
        sem_results=$(systemd-run --user --scope -p MemoryMax=50G --quiet parallel -j {{.JOBS}} --halt never ./scripts/run_fmt_semantic.sh {} {{.BLINKC}} .tmp/fmt_skip.txt ::: tests/test_*.bl 2>&1 || true)

        all_results=$(printf '%s\n%s\n%s' "$golden_results" "$idem_results" "$sem_results")

        passed=$(echo "$all_results" | grep -c "^PASS" || true)
        failed=$(echo "$all_results" | grep -c "^FAIL" || true)
        skipped=$(echo "$all_results" | grep -c "^SKIP" || true)
        echo "fmt: ${passed} passed, ${failed} failed, ${skipped} skipped"
        if [ "$failed" -gt 0 ]; then
          echo "Failures:"
          echo "$all_results" | grep "^FAIL" | sed 's/^/  /'
          exit 1
        fi
      - task: ci-per-module
      - task: test-installed
      - task: __build-binaries-smoke

  ci-profile:
    desc: |
      Measure wall-clock per phase of `task ci`. Re-runnable. Outputs:
        build/ci-timings.<mode>.tsv          — one row per phase (cmd, elapsed_s, max_rss_kb, exit_code)
        .tmp/fmt-{golden,idem,sem}.<mode>.joblog — GNU parallel per-file timings
      Modes:
        MODE=warm (default) — run as-is; reuses Taskfile `sources:` cache, std-cache, etc.
        MODE=cold           — wipes Taskfile cache + bootstrap outputs + .tmp/ first so every phase
                              pays its true cost.
      Use both back-to-back to attribute: (cold − warm) = work the cache saves us; warm = work that always pays.
    silent: true
    cmds:
      - |
        MODE="${MODE:-warm}"
        TSV="{{.BUILD_DIR}}/ci-timings.${MODE}.tsv"
        mkdir -p {{.BUILD_DIR}} .tmp
        # /usr/bin/time output appended per-phase. -f: format. -a: append. -o: file.
        # %e elapsed seconds (wall), %M max RSS in KB, %C the command.
        # We pass a stable phase label via env so the TSV is grep-friendly even
        # when the command itself is a long heredoc.
        TIME_BIN="/usr/bin/time"
        if [ ! -x "$TIME_BIN" ]; then
          echo "ERROR: /usr/bin/time not found — install GNU time"
          exit 1
        fi
        # We tag the format line so we can pick it out even when /usr/bin/time
        # prepends a "Command exited with non-zero status N" diagnostic. We
        # also keep going on phase failures — a single broken phase shouldn't
        # cost us the timings for everything after it. The TSV records
        # exit_code as a 4th column so failed rows are visible.
        printf 'phase\telapsed_s\tmax_rss_kb\texit_code\n' > "$TSV"
        time_phase() {
          phase="$1"; shift
          time_file=$(mktemp .tmp/ci-profile-time-XXXX)
          rc=0
          "$TIME_BIN" -f "__CIPROFILE__\t%e\t%M" -o "$time_file" sh -c "$*" || rc=$?
          line=$(grep '^__CIPROFILE__' "$time_file" | tail -1)
          es=$(printf '%s' "$line" | awk -F'\t' '{print $2}')
          mr=$(printf '%s' "$line" | awk -F'\t' '{print $3}')
          printf '%s\t%s\t%s\t%s\n' "$phase" "${es:-NA}" "${mr:-NA}" "$rc" >> "$TSV"
          rm -f "$time_file"
          if [ "$rc" != "0" ]; then
            echo "ci-profile: phase '$phase' failed (rc=$rc) — continuing to keep timings useful" >&2
          fi
        }

        if [ "$MODE" = "cold" ]; then
          # Invalidate Taskfile's sources/generates cache and the bootstrap
          # outputs so every phase actually re-runs. We deliberately keep
          # vendored object files (bootstrap/vendor/) and the std-cache so
          # the cold run reflects what a real "edit-and-rerun-ci" cycle does,
          # not a from-scratch checkout. Local compiler binaries (`blinkc`,
          # `blink`) are preserved — the developer just built them; deleting
          # them would model a from-scratch checkout, not an edit-and-rerun
          # cycle, and would force the installed-blink fallback path.
          rm -rf {{.BUILD_DIR}}/.task {{.BUILD_DIR}}/libblink_std.a {{.BUILD_DIR}}/libblink_std.h
          rm -rf {{.BUILD_DIR}}/std-cache {{.BUILD_DIR}}/smoke
          # Also wipe .tmp/ leftover object files from any prior run — the
          # build-binaries-smoke phase re-emits .tmp/{gc,sqlite3,monolith}.o
          # and will multi-define everything if stale copies linger.
          find .tmp -type f ! -name '.gitkeep' -delete 2>/dev/null || true
          echo "ci-profile: cold mode — cleared {{.BUILD_DIR}}/.task + archive + std-cache + smoke + .tmp/"
        fi

        # Phase 1: .tmp cleanup (trivial, kept for parity with `ci`).
        find .tmp -type f ! -name '.gitkeep' -delete 2>/dev/null || true

        # Phase 2: bootstrap (Gen0 → archive → Gen1 → archive(force) → Gen2).
        time_phase bootstrap './bootstrap/bootstrap.sh > /dev/null'

        # Phase 3: stdlib registry freshness.
        time_phase check-stdlib-registry 'task check-stdlib-registry > /dev/null'

        # Phase 4: rebuild build/blink (CLI), archive-linked.
        time_phase build-cli '
          if [ ! -x "{{.BUILD_DIR}}/blink" ]; then
            {{.BLINKC}} src/cli.bl {{.BUILD_DIR}}/cli.c 2>/dev/null
            sed -i "s/blink_cli_version = \"dev\"/blink_cli_version = \"{{.VERSION}}-dev+$(date +%Y%m%d%H%M%S)\"/" {{.BUILD_DIR}}/cli.c
            cc -o {{.BUILD_DIR}}/blink {{.BUILD_DIR}}/cli.c -lm -lgc
          fi
          {{.BUILD_DIR}}/blink __build-stdlib-archive
          {{.BLINKC}} --link-archive {{.BUILD_DIR}}/libblink_std.h src/cli.bl {{.BUILD_DIR}}/cli.c 2>/dev/null
          sed -i "s/blink_cli_version = \"dev\"/blink_cli_version = \"{{.VERSION}}-dev+$(date +%Y%m%d%H%M%S)\"/" {{.BUILD_DIR}}/cli.c
          cc -o {{.BUILD_DIR}}/blink {{.BUILD_DIR}}/cli.c -I{{.BUILD_DIR}} {{.BUILD_DIR}}/libblink_std.a -lm -lgc -pthread -Wl,--gc-sections
        '

        # Phase 5: full test suite (429-ish files).
        time_phase blink-test "{{.BUILD_DIR}}/blink test tests/ --parallel {{.JOBS}} --quiet"

        # Phase 6: fmt waves — each parallel invocation timed separately and
        # given its own --joblog so per-file timings are available for free.
        printf "%s\n" test_hof test_lazy_iter test_semver test_toml test_manifest test_lockfile test_http_types test_http_error test_json test_json_builder test_args test_args_cli test_derive_nested test_embed test_combining_iterators test_http_client test_iterators test_match_void_if test_multifile_visibility test_question_ops test_string_iter test_audit test_e2e_gitdep test_e2e_transitive test_e2e_pub_visibility test_async_spawn_types test_tcp_socket test_pub_import test_std_testing test_c_reserved_names test_module_qualified_types test_ue_complex_returns test_effects test_effect_vtable test_sqlite test_builtin_methods test_priv_access test_unused_import test_cross_module_effects test_cross_module_effects_helper test_test_compile_errors test_map_seed_deterministic > .tmp/fmt_skip.txt

        time_phase fmt-golden "systemd-run --user --scope -p MemoryMax=50G --quiet parallel --joblog .tmp/fmt-golden.${MODE}.joblog -j {{.JOBS}} --halt never ./scripts/run_fmt_golden.sh {} {{.BLINKC}} ::: tests/fmt/input_*.bl > /dev/null 2>&1 || true"
        time_phase fmt-idempotent "systemd-run --user --scope -p MemoryMax=50G --quiet parallel --joblog .tmp/fmt-idem.${MODE}.joblog -j {{.JOBS}} --halt never ./scripts/run_fmt_idempotent.sh {} {{.BLINKC}} .tmp/fmt_skip.txt ::: tests/test_*.bl > /dev/null 2>&1 || true"
        time_phase fmt-semantic "systemd-run --user --scope -p MemoryMax=50G --quiet parallel --joblog .tmp/fmt-sem.${MODE}.joblog -j {{.JOBS}} --halt never ./scripts/run_fmt_semantic.sh {} {{.BLINKC}} .tmp/fmt_skip.txt ::: tests/test_*.bl > /dev/null 2>&1 || true"

        # Phase 7: per-module .o pipeline + gen1/gen2 byte-equality.
        time_phase ci-per-module 'task ci-per-module > /dev/null'

        # Phase 8: installed-binary smoke.
        time_phase test-installed 'task test-installed > /dev/null'

        # Phase 9: cross-compile smoke.
        time_phase build-binaries-smoke 'task __build-binaries-smoke > /dev/null'

        # Final report — sorted desc by elapsed. "NA" rows (phase crashed
        # before time was captured) sort to the bottom via -g.
        echo ""
        echo "=== ci-profile (${MODE}) — phases sorted by wall-clock ==="
        printf 'phase\telapsed_s\tmax_rss_kb\texit_code\n'
        tail -n +2 "$TSV" | sort -t$'\t' -k2 -gr
        total=$(tail -n +2 "$TSV" | awk -F'\t' '$2 != "NA" {s+=$2} END {printf "%.2f", s}')
        failures=$(tail -n +2 "$TSV" | awk -F'\t' '$4 != "0" {print $1}' | tr '\n' ' ')
        echo ""
        echo "TOTAL: ${total}s"
        if [ -n "$failures" ]; then
          echo "FAILED phases (still timed): $failures"
        fi
        echo "TSV:     $TSV"
        echo "Joblogs: .tmp/fmt-{golden,idem,sem}.${MODE}.joblog"
        echo ""
        echo "To compare cold vs warm:"
        echo "  MODE=cold task ci-profile && MODE=warm task ci-profile"
        echo "  paste {{.BUILD_DIR}}/ci-timings.cold.tsv {{.BUILD_DIR}}/ci-timings.warm.tsv"

  ci-per-module:
    desc: Verify per-module .o pipeline produces a binary identical in behaviour to monolith mode
    silent: true
    deps: [build-cli]
    sources:
      - src/*.bl
      - lib/std/*.bl
      - tests/multifile/src/*.bl
      - tests/multifile_stdlib_priv/src/*.bl
    cmds:
      - |
        set -e
        # Bootstrap loop must not consult the .o cache — emit-per-module
        # owns its own tmpdirs and cc invocations, so cache state must
        # not leak into the byte-equality and self-host checks below.
        export BLINK_CACHE_DIR=
        TMPDIR=$(mktemp -d)
        trap "rm -rf $TMPDIR" EXIT

        # Monolith reference run.
        {{.BUILD_DIR}}/blink run tests/multifile/src/main.bl > "$TMPDIR/monolith.out" 2>&1

        # Per-module emit + cc link with pinned (sorted) link order.
        mkdir -p "$TMPDIR/per_mod"
        {{.BUILD_DIR}}/blink __emit-per-module tests/multifile/src/main.bl "$TMPDIR/per_mod"
        cc -o "$TMPDIR/per_mod/bin" $(ls "$TMPDIR"/per_mod/*.c | sort) -Ibuild -lm -lgc
        "$TMPDIR/per_mod/bin" > "$TMPDIR/per_module.out" 2>&1

        if diff -u "$TMPDIR/monolith.out" "$TMPDIR/per_module.out" > /dev/null; then
          echo "ci-per-module: ok (multifile, output matches monolith)"
        else
          echo "FAIL ci-per-module: per-module binary output differs from monolith"
          echo "--- monolith"
          cat "$TMPDIR/monolith.out"
          echo "--- per-module"
          cat "$TMPDIR/per_module.out"
          exit 1
        fi

        # br yk0mha: non-pub stdlib `let`s must stay file-local (`static`) under
        # per-module emit and must NOT be declared `extern` in a consuming TU
        # (the definition is static — a foreign extern references an undefined
        # symbol). Fixture pulls std.semver (non-pub CH_*/OP_* consts) into two
        # user TUs; emit per-module, link, and assert no private extern leak.
        {{.BUILD_DIR}}/blink run tests/multifile_stdlib_priv/src/main.bl > "$TMPDIR/priv_mono.out" 2>&1
        mkdir -p "$TMPDIR/priv_pm"
        {{.BUILD_DIR}}/blink __emit-per-module tests/multifile_stdlib_priv/src/main.bl "$TMPDIR/priv_pm"
        # No non-pub stdlib symbol (semver's CH_*/OP_*) may be declared extern in
        # any consumer TU (everything except the owning std_semver.c).
        LEAK=$(/usr/bin/grep -rnE 'extern .*\b(CH_[A-Z0-9]+|OP_[A-Z]+)\b' "$TMPDIR"/priv_pm/*.c | /usr/bin/grep -v '/std_semver.c:' || true)
        if [ -n "$LEAK" ]; then
          echo "FAIL ci-per-module: non-pub stdlib let leaked as extern into a consumer TU (br yk0mha)"
          echo "$LEAK"
          exit 1
        fi
        cc -o "$TMPDIR/priv_pm/bin" $(ls "$TMPDIR"/priv_pm/*.c | sort) -Ibuild -lm -lgc
        "$TMPDIR/priv_pm/bin" > "$TMPDIR/priv_pm.out" 2>&1
        if diff -u "$TMPDIR/priv_mono.out" "$TMPDIR/priv_pm.out" > /dev/null; then
          echo "ci-per-module: ok (stdlib-priv: no private extern leak, output matches monolith)"
        else
          echo "FAIL ci-per-module: stdlib-priv per-module output differs from monolith"
          echo "--- monolith"; cat "$TMPDIR/priv_mono.out"
          echo "--- per-module"; cat "$TMPDIR/priv_pm.out"
          exit 1
        fi

        # Self-host: per-module emit on the compiler itself must produce a
        # working blink binary that can typecheck a sample program. We use
        # this same emit dir for the regen-invariant gen1/gen2 diff below.
        mkdir -p "$TMPDIR/cli_pm"
        {{.BUILD_DIR}}/blink __emit-per-module src/cli.bl "$TMPDIR/cli_pm"
        # Pinned link order (sorted glob) so the final binary is also stable.
        cc -o "$TMPDIR/cli_pm/blink-pm" $(ls "$TMPDIR"/cli_pm/*.c | sort) -Ibuild -lm -lgc
        "$TMPDIR/cli_pm/blink-pm" check tests/multifile/src/main.bl > "$TMPDIR/selfhost.out" 2>&1
        if /usr/bin/grep -q "^ok:" "$TMPDIR/selfhost.out"; then
          echo "ci-per-module: ok (cli.bl self-host)"
        else
          echo "FAIL ci-per-module: per-module-built compiler failed self-host check"
          cat "$TMPDIR/selfhost.out"
          exit 1
        fi

        # bc004e regen invariant: per-module emit must be deterministic
        # across runs AND byte-equal between gen1 (current build/blink)
        # and gen2 (the per-module-built compiler from the self-host
        # step). Combined check — re-emit with build/blink for determinism,
        # emit with blink-pm for the regen leg, diff both against cli_pm.
        mkdir -p "$TMPDIR/det" "$TMPDIR/gen2"
        {{.BUILD_DIR}}/blink __emit-per-module src/cli.bl "$TMPDIR/det"
        "$TMPDIR/cli_pm/blink-pm" __emit-per-module src/cli.bl "$TMPDIR/gen2"
        diff_dirs() {
          fail=0
          for f in "$TMPDIR/cli_pm"/*.c "$TMPDIR/cli_pm"/*.h; do
            bn=$(basename "$f")
            if ! diff -q "$f" "$1/$bn" > /dev/null 2>&1; then
              echo "  DIFF $bn"
              fail=1
            fi
          done
          return $fail
        }
        if ! diff_dirs "$TMPDIR/det"; then
          echo "FAIL ci-per-module: per-module emit is not deterministic across runs"
          exit 1
        fi
        echo "ci-per-module: ok (per-module emit is deterministic across runs)"
        if ! diff_dirs "$TMPDIR/gen2"; then
          echo "FAIL ci-per-module: gen1 vs gen2 per-module .c/.h are not byte-equal"
          exit 1
        fi
        echo "ci-per-module: ok (gen1 vs gen2 per-module byte-equal)"

  gen-stdlib-registry:
    desc: Regenerate src/embedded_stdlib_registry.bl from lib/std and lib/pkg
    sources:
      - lib/std/*.bl
      - lib/pkg/*.bl
      - scripts/gen_embedded_stdlib.sh
    generates:
      - src/embedded_stdlib_registry.bl
    cmds:
      - ./scripts/gen_embedded_stdlib.sh

  check-stdlib-registry:
    desc: Fail if src/embedded_stdlib_registry.bl is stale vs lib/std and lib/pkg
    sources:
      - lib/std/*.bl
      - lib/pkg/*.bl
      - scripts/gen_embedded_stdlib.sh
      - src/embedded_stdlib_registry.bl
    cmds:
      - |
        ./scripts/gen_embedded_stdlib.sh > /dev/null
        if ! git diff --quiet -- src/embedded_stdlib_registry.bl; then
          echo "ERROR: src/embedded_stdlib_registry.bl is stale." >&2
          echo "Run: task gen-stdlib-registry, then commit." >&2
          git --no-pager diff -- src/embedded_stdlib_registry.bl >&2
          exit 1
        fi
        echo "stdlib-registry: ok"

  clean-tmp:
    desc: Remove all temp files from .tmp/
    cmds:
      - find .tmp -type f ! -name '.gitkeep' -delete 2>/dev/null || true

  bench:
    desc: Compile and run benchmarks/arena_process_batch.bl (release mode)
    deps: [build-cli]
    cmds:
      - '{{.BUILD_DIR}}/blink build --release benchmarks/arena_process_batch.bl -o {{.BUILD_DIR}}/arena_process_batch'
      - '{{.BUILD_DIR}}/arena_process_batch'

  build-binaries:
    desc: Cross-compile blink CLI binaries for all platforms
    deps: [build-cli]
    vars:
      GC_SRC: bootstrap/vendor/gc/extra/gc.c
      GC_INC: bootstrap/vendor/gc/include
      GC_STUBS: bootstrap/vendor/gc/include/zig-stubs
      GC_DEFS: -DGC_THREADS -DGC_BUILTIN_ATOMIC -DUSE_MMAP -DUSE_MUNMAP
      GC_MACOS_DEFS: -DGC_THREADS -DGC_BUILTIN_ATOMIC -DUSE_MMAP -DUSE_MUNMAP -DNO_MPROTECT_VDB
      # Peeled native deps (e.g. sqlite3) are NOT linked into the released
      # CLI — the archive monolith excludes them and the CLI itself doesn't
      # import std.db_sqlite. Each registered dep's source ships as a
      # sidecar under share/blink/native/<name>/ (see dist layout below)
      # so user programs that DO import a peeled module can find them.
      MONO_DEFS: -ffunction-sections -fdata-sections
    cmds:
      # Emit the user-TU cli.c in archive mode (matches build-cli).
      - "{{.BLINKC}} --link-archive {{.BUILD_DIR}}/libblink_std.h src/cli.bl {{.BUILD_DIR}}/cli.c"
      - sed -i 's/blink_cli_version = "[^"]*"/blink_cli_version = "{{.VERSION}}"/' {{.BUILD_DIR}}/cli.c
      - mkdir -p .tmp
      # GC per target
      - zig cc -c -O2 {{.GC_DEFS}} -I{{.GC_INC}} -target x86_64-linux-gnu -o .tmp/gc-linux-x86_64.o {{.GC_SRC}}
      - zig cc -c -O2 {{.GC_MACOS_DEFS}} -I{{.GC_STUBS}} -I{{.GC_INC}} -target x86_64-macos -o .tmp/gc-macos-x86_64.o {{.GC_SRC}}
      - zig cc -c -O2 {{.GC_MACOS_DEFS}} -I{{.GC_STUBS}} -I{{.GC_INC}} -target aarch64-macos -o .tmp/gc-macos-aarch64.o {{.GC_SRC}}
      # stdlib monolith per target (uses the same archive sources that build-cli compiled host-side via __build-stdlib-archive)
      - |
        ARC_REL="{{.BUILD_DIR}}/$(readlink {{.BUILD_DIR}}/libblink_std.a | xargs dirname)"
        zig cc -c -O2 {{.MONO_DEFS}} -target x86_64-linux-gnu -I{{.GC_INC}} -I"$ARC_REL" -o .tmp/monolith-linux-x86_64.o "$ARC_REL/monolith.c"
        zig cc -c -O2 {{.MONO_DEFS}} -target x86_64-macos -I{{.GC_STUBS}} -I{{.GC_INC}} -I"$ARC_REL" -o .tmp/monolith-macos-x86_64.o "$ARC_REL/monolith.c"
        zig cc -c -O2 {{.MONO_DEFS}} -target aarch64-macos -I{{.GC_STUBS}} -I{{.GC_INC}} -I"$ARC_REL" -o .tmp/monolith-macos-aarch64.o "$ARC_REL/monolith.c"
      # Link each target binary against its own GC + stdlib monolith. The
      # CLI doesn't import any peeled native dep, so no sqlite3.o here.
      - zig cc -O2 -Wno-parentheses-equality -I{{.GC_INC}} -I{{.BUILD_DIR}} -target x86_64-linux-gnu -o {{.BUILD_DIR}}/blink-linux-x86_64 {{.BUILD_DIR}}/cli.c .tmp/monolith-linux-x86_64.o .tmp/gc-linux-x86_64.o -lm -Wl,--gc-sections
      - zig cc -O2 -Wno-parentheses-equality -I{{.GC_STUBS}} -I{{.GC_INC}} -I{{.BUILD_DIR}} -target x86_64-macos -o {{.BUILD_DIR}}/blink-macos-x86_64 {{.BUILD_DIR}}/cli.c .tmp/monolith-macos-x86_64.o .tmp/gc-macos-x86_64.o -lm -Wl,-dead_strip
      - zig cc -O2 -Wno-parentheses-equality -I{{.GC_STUBS}} -I{{.GC_INC}} -I{{.BUILD_DIR}} -target aarch64-macos -o {{.BUILD_DIR}}/blink-macos-aarch64 {{.BUILD_DIR}}/cli.c .tmp/monolith-macos-aarch64.o .tmp/gc-macos-aarch64.o -lm -Wl,-dead_strip
      # Per-target stdlib archives, assembled from the matching monolith.o so
      # the released `blink` can link user code at user-compile time. The host
      # archive's libblink_std.a is single-object (just monolith.o), so we
      # produce the same shape here per target. zig ar emits a portable
      # ranlib'd archive regardless of host toolchain.
      - |
        for t in linux-x86_64 macos-x86_64 macos-aarch64; do
          rm -f .tmp/libblink_std-$t.a
          zig ar rcs .tmp/libblink_std-$t.a .tmp/monolith-$t.o
        done
      # Stage release layout per target: bin/blink + share/blink/{archive,headers,native/}.
      # This matches `task install` layout (bin/, share/blink/) so the
      # binary's resolve_install_root() finds share/blink/ via argv[0].
      # Each registered native dep ships under share/blink/native/<name>/ so
      # user programs that import a peeled module (e.g. std.db_sqlite) can
      # find the vendored source at compile time.
      - |
        ARC_REL="{{.BUILD_DIR}}/$(readlink {{.BUILD_DIR}}/libblink_std.a | xargs dirname)"
        rm -rf {{.BUILD_DIR}}/dist
        for t in linux-x86_64 macos-x86_64 macos-aarch64; do
          d={{.BUILD_DIR}}/dist/blink-$t
          mkdir -p $d/bin $d/share/blink
          cp {{.BUILD_DIR}}/blink-$t $d/bin/blink
          cp .tmp/libblink_std-$t.a $d/share/blink/libblink_std.a
          cp "$ARC_REL/libblink_std.h" $d/share/blink/libblink_std.h
          cp {{.BUILD_DIR}}/runtime.h $d/share/blink/runtime.h
          # Identity stamp: runtime.h SHA must match the shipped runtime.h so
          # the released blink accepts its own archive at link time. The
          # per-target .a is zig-rebuilt from the same monolith/runtime.h, so
          # the dev stamp (keyed on runtime.h SHA) is valid here (br 105z02).
          cp -L {{.BUILD_DIR}}/.archive-id $d/share/blink/.archive-id
          {{.BUILD_DIR}}/blink __native-deps | while IFS='|' read -r NAME SRCS HDR_DIR _DEFS _GATE; do
            [ -z "$NAME" ] && continue
            DEST="$d/share/blink/native/$NAME"
            mkdir -p "$DEST"
            IFS=',' ; for SRC in $SRCS; do cp "$SRC" "$DEST/" ; done ; unset IFS
            if [ -d "$HDR_DIR" ]; then
              find "$HDR_DIR" -maxdepth 1 -name '*.h' -exec cp {} "$DEST/" \;
            fi
          done
        done
      # Tar each layout for upload. Use `-C` so the top-level dir inside the
      # tar is blink-<target>/, giving extractors a clean rename target.
      - |
        for t in linux-x86_64 macos-x86_64 macos-aarch64; do
          tar -czf {{.BUILD_DIR}}/blink-$t.tar.gz -C {{.BUILD_DIR}}/dist blink-$t
        done
      - echo "Built binaries + dist tarballs for linux-x86_64, macos-x86_64, macos-aarch64 ({{.VERSION}})"

  __build-binaries-smoke:
    desc: One-target cross-compile smoke. Catches archive-mode regressions in the build-binaries pipeline at PR time (vs at release-cut).
    deps: [build-cli]
    vars:
      GC_SRC: bootstrap/vendor/gc/extra/gc.c
      GC_INC: bootstrap/vendor/gc/include
      GC_DEFS: -DGC_THREADS -DGC_BUILTIN_ATOMIC -DUSE_MMAP -DUSE_MUNMAP
      MONO_DEFS: -ffunction-sections -fdata-sections
    sources:
      - src/cli.bl
      - '{{.BUILD_DIR}}/blinkc'
      - '{{.BUILD_DIR}}/libblink_std.a'
      - '{{.BUILD_DIR}}/libblink_std.h'
      - bootstrap/vendor/gc/extra/gc.c
      - bootstrap/vendor/gc/include/**/*.h
      - Taskfile.yml
    generates:
      - '{{.BUILD_DIR}}/smoke/blink-smoke'
    preconditions:
      - sh: test -L {{.BUILD_DIR}}/libblink_std.a
        msg: "{{.BUILD_DIR}}/libblink_std.a is missing or not a symlink (expected std-cache/<hash>/libblink_std.a)"
    cmds:
      - |
        set -e
        OUTDIR="{{.BUILD_DIR}}/smoke"
        mkdir -p "$OUTDIR"
        # Reuse build/cli.c emitted by build-cli; re-emit if missing.
        if [ -s "{{.BUILD_DIR}}/cli.c" ]; then
          cp "{{.BUILD_DIR}}/cli.c" "$OUTDIR/cli.c"
        else
          {{.BLINKC}} --link-archive {{.BUILD_DIR}}/libblink_std.h src/cli.bl "$OUTDIR/cli.c"
        fi
        ARC_REL="$(dirname "$(readlink -f {{.BUILD_DIR}}/libblink_std.a)")"
        zig cc -c -O2 {{.GC_DEFS}} -I{{.GC_INC}} -target x86_64-linux-gnu -o "$OUTDIR/gc.o" {{.GC_SRC}}
        # No sqlite3.o — peeled out of the archive, CLI doesn't import std.db_sqlite.
        zig cc -c -O2 {{.MONO_DEFS}} -target x86_64-linux-gnu -I{{.GC_INC}} -I"$ARC_REL" -o "$OUTDIR/monolith.o" "$ARC_REL/monolith.c"
        zig cc -O2 -Wno-parentheses-equality -I{{.GC_INC}} -I{{.BUILD_DIR}} -target x86_64-linux-gnu -o "$OUTDIR/blink-smoke" "$OUTDIR/cli.c" "$OUTDIR/monolith.o" "$OUTDIR/gc.o" -lm -Wl,--gc-sections
        # Smoke binary must not contain sqlite symbols.
        SQL_SYMS=$(nm "$OUTDIR/blink-smoke" 2>/dev/null | grep -c -E '^[0-9a-f]+ T (blink_)?sqlite3_' || true)
        if [ "$SQL_SYMS" -ne 0 ]; then
          echo "build-binaries-smoke: FAIL — smoke binary contains $SQL_SYMS sqlite text symbols" >&2
          exit 1
        fi
        echo "build-binaries-smoke: ok (x86_64-linux archive-mode link, zero sqlite symbols)"

  release:
    desc: "Create a GitHub release (usage: task release -- v0.5.0)"
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Version required. Usage: task release -- v0.5.0"
      - sh: echo "{{.CLI_ARGS}}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'
        msg: "Version must match vX.Y.Z format (e.g. v0.5.0)"
      - sh: test "v{{.VERSION}}" = "{{.CLI_ARGS}}"
        msg: "Tag {{.CLI_ARGS}} does not match VERSION file (v{{.VERSION}}). Update VERSION first."
      - sh: test -z "$(git status --porcelain)"
        msg: "Working directory must be clean. Commit or stash changes first."
    cmds:
      - task: ci
      - task: build-binaries
      - git tag {{.CLI_ARGS}}
      - git push origin {{.CLI_ARGS}}
      - |
        gh release create {{.CLI_ARGS}} \
          {{.BUILD_DIR}}/blink-linux-x86_64.tar.gz \
          {{.BUILD_DIR}}/blink-macos-x86_64.tar.gz \
          {{.BUILD_DIR}}/blink-macos-aarch64.tar.gz \
          install.sh \
          llms-full.md \
          --title "{{.CLI_ARGS}}" \
          --generate-notes
      - echo "Released {{.CLI_ARGS}} — https://github.com/blinklang/blink/releases/tag/{{.CLI_ARGS}}"
      - sed -i 's/blink_cli_version = "[^"]*"/blink_cli_version = "{{.VERSION}}"/' {{.BUILD_DIR}}/cli.c
      - cc -o {{.BUILD_DIR}}/blink {{.BUILD_DIR}}/cli.c -I{{.BUILD_DIR}} {{.BUILD_DIR}}/libblink_std.a -lm -lgc -pthread -Wl,--gc-sections
      - task: build
